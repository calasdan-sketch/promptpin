[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpin"
version = "0.2.0"
description = "Git-native prompt registry: version prompts with git, pin versions to envs, log what served, diff with evals attached."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Calas Automations" }]
keywords = ["prompts", "llm", "versioning", "git", "mlops"]
dependencies = ["pyyaml>=6"]

[project.scripts]
promptpin = "promptpin.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import shared helpers as `tests.conftest`; make plain `pytest` work
# from a fresh clone (not only `python -m pytest`).
pythonpath = ["."]
